# docker-compose.yml
# Run with: docker-compose up -d
# Stop with: docker-compose down

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: serendib_postgres
    environment:
      POSTGRES_DB: serendib_db # Database name
      POSTGRES_USER: serendib_user # Username
      POSTGRES_PASSWORD: serendib_pass # Password
    ports:
      - "5432:5432" # host: container
    volumes:
      - postgres_data:/var/lib/postgresql/data # Persist data

  redis:
    image: redis:7-alpine
    container_name: serendib_redis
    ports:
      - "6382:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
     image: confluentinc/cp-kafka:7.5.0
     depends_on:
       - zookeeper
     ports:
       - "9092:9092"
     environment:
       KAFKA_BROKER_ID: 1
       KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
       KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
       KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
       KAFKA_AUTO_CREATE_TOPICS_ENABLE: true

# Named volume so data survives container restarts
volumes:
  postgres_data: