spring:
  application:
    name: serendib-api

  # Database connection (PostgreSQL in Docker)
  datasource:
    url: jdbc:postgresql://localhost:5432/serendib_db
    username: serendib_user
    password: serendib_pass
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate settings
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # Flyway — runs SQL migration files automatically on startup
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

app:
  jwt:
    secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
    expiration: 86400000 # 24hr in ms
