spring:
  application:
    name: serendib-api

  datasource:
    url: jdbc:postgresql://localhost:5432/serendib_db
    username: serendib_user
    password: serendib_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        project-id: 993044039755
        chat:
          options:
            model: gemini-3.5-flash



server:
  port: 8080

app:
  jwt:
    secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
    expiration: 86400000